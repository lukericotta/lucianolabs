<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LucianoLabs</title>
<style>
:root{--bg:#faf9f7;--card:#fff;--ink:#1c1b1a;--muted:#6b6863;--line:#e7e4df;--accent:#ea580c}
@media(prefers-color-scheme:dark){:root{--bg:#141312;--card:#1d1b1a;--ink:#f2efeb;--muted:#a49f98;--line:#2c2926;--accent:#fb923c}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.card{max-width:34rem;padding:2.5rem 1.5rem;text-align:center}
.dot{width:3rem;height:3rem;border-radius:1rem;margin:0 auto 1rem;background:linear-gradient(135deg,#fbbf24,var(--accent))}
h1{font-size:2rem;letter-spacing:-.02em;margin:.2rem 0}p{color:var(--muted)}
.links{display:flex;gap:1rem;justify-content:center;margin-top:1.5rem}
a{color:var(--accent);text-decoration:none;font-weight:600;border:1px solid var(--line);padding:.6rem 1.1rem;border-radius:.7rem}
</style></head>
<body><div class="card"><div class="dot"></div><h1>LucianoLabs</h1>
<p>Small, private, on-device iOS apps.</p>
<div class="links"><a href="privacy.html">Privacy</a><a href="support.html">Support</a></div></div></body></html>
